apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-demo
  namespace: project-20
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo ok >/scratch/out && sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          metadata:
            name: scratch-claim
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
